[project]
name = "gpuwait"
version = "0.1.0"
description = "GPU Idle Score for local LLM servers: replay a request trace against your own Ollama, llama-server, vLLM, mlx-lm or LM Studio and see how much of the time the GPU sits idle between requests."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur", email = "levi74108520963@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "gpu",
    "llm",
    "ollama",
    "llama-server",
    "vllm",
    "mlx-lm",
    "lm-studio",
    "benchmark",
    "load-test",
    "local-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "httpx==0.28.1",
    "rich==15.0.0",
]

[project.urls]
Homepage = "https://github.com/Arthur031221/gpuwait"
Issues = "https://github.com/Arthur031221/gpuwait/issues"
Changelog = "https://github.com/Arthur031221/gpuwait/blob/main/CHANGELOG.md"

[project.scripts]
gpuwait = "gpuwait.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpuwait"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
